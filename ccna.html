<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA & CCNP Networking Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pyodide Browser Python Interpreter -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans flex items-center justify-center p-3">

  <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
    
    <!-- Top Progress Bar -->
    <div class="bg-blue-900 p-4 text-white flex justify-between items-center border-b border-blue-800">
      <div>
        <span id="level-badge" class="bg-blue-600 text-xs font-bold uppercase px-2 py-1 rounded">Level 3</span>
        <h1 class="text-sm font-semibold mt-1" id="q-progress">Question 21 / 30</h1>
      </div>
      <div class="text-right">
        <div id="lives-display" class="text-red-400 font-bold text-sm">❤️ Lives: 3/3</div>
        <div id="skips-display" class="text-xs text-blue-200 mt-0.5">Skips: 3 left</div>
      </div>
    </div>

    <!-- Question Container -->
    <div class="p-5">
      <h2 id="q-title" class="text-xs font-bold text-blue-600 uppercase tracking-wide mb-1">Level 3: Cisco Automation Scripting</h2>
      <p id="q-text" class="text-gray-800 font-medium text-base mb-4">Loading question...</p>

      <!-- Text Input Form (Levels 1 & 2) -->
      <div id="input-container" class="mb-4 hidden">
        <input type="text" id="user-answer" placeholder="Type answer, command, or notation..." 
               class="w-full border-2 border-slate-300 p-3 rounded-xl focus:border-blue-600 outline-none text-gray-800 text-base font-mono">
      </div>

      <!-- Live Mobile Code Compiler (Level 3) -->
      <div id="compiler-container" class="mb-4">
        <label class="block text-xs font-semibold text-slate-700 mb-1">🌐 Network Automation Terminal (Python):</label>
        <textarea id="python-code" rows="5" spellcheck="false"
                  class="w-full bg-slate-950 text-sky-400 font-mono text-xs p-3 rounded-xl focus:outline-none mb-2 border border-slate-800" 
                  placeholder="# Write Python code to construct Cisco configs or parse network data..."></textarea>
        
        <button onclick="runPythonCode()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700 transition mb-2">
          ▶️ Run Network Script
        </button>

        <label class="block text-xs font-semibold text-gray-500 mb-1">Terminal Output:</label>
        <pre id="code-output" class="bg-slate-950 p-3 rounded-lg text-xs font-mono text-sky-400 min-h-[60px] max-h-[120px] overflow-y-auto border border-slate-800">Terminal output will appear here...</pre>
      </div>

      <!-- Submit Button -->
      <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-700 transition active:scale-95 mb-3">
        Submit Answer
      </button>

      <!-- Control Buttons (Prev, Hint, Skip) -->
      <div class="grid grid-cols-3 gap-2 mb-3">
        <button id="prev-btn" onclick="prevQuestion()" class="bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-xs hover:bg-slate-300 transition disabled:opacity-40 disabled:cursor-not-allowed">
          ⬅️ Prev
        </button>
        <button onclick="toggleHint()" class="bg-amber-100 text-amber-800 font-semibold py-2 rounded-lg text-xs hover:bg-amber-200 transition">
          💡 Hint
        </button>
        <button onclick="skipQuestion()" class="bg-slate-100 text-slate-700 font-semibold py-2 rounded-lg text-xs hover:bg-slate-200 transition">
          ⏭️ Skip
        </button>
      </div>

      <!-- Reset Progress Option -->
      <div class="text-center">
        <button onclick="resetGameProgress()" class="text-slate-400 hover:text-red-500 text-[10px] underline">
          Restart Game from Q1
        </button>
      </div>

      <!-- Hint Box -->
      <div id="hint-box" class="hidden mt-3 p-3 bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-lg">
        <strong>Hint:</strong> <span id="hint-text"></span>
      </div>
    </div>
  </div>

  <!-- Funny Monkey Error Modal -->
  <div id="monkey-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl p-5 text-center max-w-xs w-full shadow-2xl border border-slate-200">
      <img src="https://media.giphy.com/media/eH4O6fWvuKePi/giphy.gif" alt="Funny Monkey" class="w-36 h-36 object-cover mx-auto rounded-xl mb-3 shadow">
      <h3 class="text-lg font-bold text-red-600">Packet Dropped! Wrong Answer</h3>
      <p id="modal-subtext" class="text-xs text-gray-600 my-2">You lost 1 life! Try again.</p>
      
      <!-- Show Solution Button (Appears after 5 failed attempts) -->
      <button id="reveal-solution-btn" onclick="revealSolution()" class="w-full bg-amber-500 text-white font-bold py-2 rounded-xl text-xs shadow hover:bg-amber-600 mb-2 hidden">
        🔓 Reveal Solution Code
      </button>

      <!-- Solution Display Box -->
      <div id="solution-box" class="hidden my-2 p-2 bg-slate-950 text-sky-400 font-mono text-[11px] rounded-lg text-left overflow-x-auto border border-slate-800 max-h-[100px]">
        <pre id="solution-code-text"></pre>
      </div>

      <button onclick="closeModal()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-sm shadow hover:bg-blue-700">
        Try Again
      </button>
    </div>
  </div>

  <script>
    // INITIALIZE PYODIDE IN BACKGROUND
    let pyodideInstance = null;
    async function initPyodide() {
      if (!pyodideInstance) {
        pyodideInstance = await loadPyodide();
      }
    }
    initPyodide();

    // 30 CCNA & CCNP QUESTIONS DATASET
    const QUESTIONS = [
      // Level 1: Terminology & Fundamentals (1-10)
      { id: 1, level: 1, type: 'text', q: "1. Which OSI layer is responsible for logical IP addressing and routing?", ans: "network", hint: "Layer 3 of the OSI model." },
      { id: 2, level: 1, type: 'text', q: "2. What protocol resolves an IP address to a physical MAC address?", ans: "arp", hint: "Address Resolution Protocol." },
      { id: 3, level: 1, type: 'text', q: "3. What is the default Administrative Distance (AD) of a statically configured route in Cisco IOS?", ans: "1", hint: "It is the most trusted route after directly connected (0)." },
      { id: 4, level: 1, type: 'text', q: "4. What subnet mask corresponds to CIDR prefix /24 in dotted decimal?", ans: "255.255.255.0", hint: "First three octets fully set to 255." },
      { id: 5, level: 1, type: 'text', q: "5. Which layer 2 protocol prevents switching loops in Ethernet topologies?", ans: "stp", hint: "Spanning Tree Protocol." },
      { id: 6, level: 1, type: 'text', q: "6. What port does SSH use by default?", ans: "22", hint: "Secure replacement for Telnet (23)." },
      { id: 7, level: 1, type: 'text', q: "7. How many usable host IP addresses are in a /28 subnet?", ans: "14", hint: "Formula: (2^4) - 2." },
      { id: 8, level: 1, type: 'text', q: "8. What command enters Global Configuration mode in Cisco IOS?", ans: "configure terminal", hint: "Or 'conf t' for short." },
      { id: 9, level: 1, type: 'text', q: "9. Which dynamic routing protocol uses the Dijkstra Shortest Path First (SPF) algorithm?", ans: "ospf", hint: "Open Shortest Path First." },
      { id: 10, level: 1, type: 'text', q: "10. What type of IPv6 address is equivalent to IPv4 private addresses (FC00::/7)?", ans: "unique local", hint: "Unique Local Address (ULA)." },

      // Level 2: Analysis & Command Prediction (11-20)
      { id: 11, level: 2, type: 'text', q: "11. What Cisco command displays the IP routing table status on a router?", ans: "show ip route", hint: "'show ip _____'." },
      { id: 12, level: 2, type: 'text', q: "12. In Cisco switches, which trunking encapsulation standard uses 802.1Q tagging?", ans: "dot1q", hint: "IEEE 802.1Q standard encapsulation name." },
      { id: 13, level: 2, type: 'text', q: "13. What Administrative Distance (AD) is assigned to OSPF routes by default?", ans: "110", hint: "Between EIGRP (90) and RIP (120)." },
      { id: 14, level: 2, type: 'text', q: "14. What is the broadcast address for the network 192.168.1.0/26?", ans: "192.168.1.63", hint: "Block size is 64. Next block starts at .64." },
      { id: 15, level: 2, type: 'text', q: "15. What Cisco IOS command configures an interface as an 802.1Q trunk port?", ans: "switchport mode trunk", hint: "'switchport mode _____'" },
      { id: 16, level: 2, type: 'text', q: "16. In OSPF, what is the default Hello timer interval on broadcast multiaccess networks (in seconds)?", ans: "10", hint: "10 seconds Hello, 40 seconds Dead." },
      { id: 17, level: 2, type: 'text', q: "17. Which protocol provides gateway redundancy by allowing multiple routers to share a virtual IP (HSRP/VRRP/GLBP)?", ans: "hsrp", hint: "Cisco proprietary Hot Standby Router Protocol." },
      { id: 18, level: 2, type: 'text', q: "18. What wildcard mask is used in OSPF network commands for a /24 network?", ans: "0.0.0.255", hint: "Inverse of 255.255.255.0." },
      { id: 19, level: 2, type: 'text', q: "19. Which BGP attribute is Cisco-proprietary and evaluated first in path selection?", ans: "weight", hint: "Local to the router, higher is preferred (0-65535)." },
      { id: 20, level: 2, type: 'text', q: "20. What Cisco command saves the running configuration to NVRAM?", ans: "copy running-config startup-config", hint: "Or 'write memory' / 'wr'." },

      // Level 3: Network Scripting & Automation (21-30)
      { id: 21, level: 3, type: 'code', q: "21. Write Python code to construct a Cisco IOS interface config block for GigabitEthernet0/1 with IP 10.0.0.1/24.", req: "ip address 10.0.0.1 255.255.255.0", fullSolution: "ip = '10.0.0.1'\nmask = '255.255.255.0'\ncfg = f'interface GigabitEthernet0/1\\n ip address {ip} {mask}\\n no shutdown'\nprint(cfg)", hint: "f'interface GigabitEthernet0/1\\n ip address {ip} {mask}\\n no shutdown'" },
      { id: 22, level: 3, type: 'code', q: "22. Write Python code to calculate total host bits and number of usable host IPs for a /26 prefix.", req: "usable", fullSolution: "prefix = 26\nhost_bits = 32 - prefix\nusable = (2 ** host_bits) - 2\nprint(f'Host bits: {host_bits}, Usable IPs: {usable}')", hint: "host_bits = 32 - 26; usable = (2**host_bits) - 2" },
      { id: 23, level: 3, type: 'code', q: "23. Write Python code to format an OSPF network statement command for 172.16.1.0/24 in Area 0.", req: "router ospf", fullSolution: "net = '172.16.1.0'\nwildcard = '0.0.0.255'\narea = 0\ncmd = f'router ospf 1\\n network {net} {wildcard} area {area}'\nprint(cmd)", hint: "f'router ospf 1\\n network {net} {wildcard} area {area}'" },
      { id: 24, level: 3, type: 'code', q: "24. Write Python code to convert CIDR integer prefix (e.g., 24) to host count.", req: "2**", fullSolution: "cidr = 24\ntotal_ips = 2 ** (32 - cidr)\nprint(f'Total IPs: {total_ips}')", hint: "2 ** (32 - cidr)" },
      { id: 25, level: 3, type: 'code', q: "25. Write Python code that loops through VLAN IDs [10, 20, 30] and prints 'vlan <id>' commands.", req: "vlan", fullSolution: "vlans = [10, 20, 30]\nfor v in vlans:\n    print(f'vlan {v}\\n name DATA_{v}')", hint: "for v in vlans: print(f'vlan {v}')" },
      { id: 26, level: 3, type: 'code', q: "26. Write Python code to parse a Cisco CLI ARP table string and extract IP addresses.", req: "split", fullSolution: "arp = 'Internet 192.168.1.1 10 c025.a12b.44cd ARPA GigabitEthernet0/0'\nparts = arp.split()\nip = parts[1]\nprint(f'Extracted IP: {ip}')", hint: "arp.split()[1]" },
      { id: 27, level: 3, type: 'code', q: "27. Write Python code to build a static route command for 192.168.2.0/24 via next-hop 10.0.0.2.", req: "ip route", fullSolution: "net = '192.168.2.0'\nmask = '255.255.255.0'\nnexthop = '10.0.0.2'\nprint(f'ip route {net} {mask} {nexthop}')", hint: "f'ip route {net} {mask} {nexthop}'" },
      { id: 28, level: 3, type: 'code', q: "28. Write Python code to parse a list of routing entries and filter only OSPF routes (prefixed with 'O').", req: "startswith('O')", fullSolution: "routes = ['C 10.0.0.0/24', 'O 172.16.0.0/16', 'S 0.0.0.0/0', 'O 192.168.5.0/24']\nospf_routes = [r for r in routes if r.startswith('O')]\nprint(ospf_routes)", hint: "[r for r in routes if r.startswith('O')]" },
      { id: 29, level: 3, type: 'code', q: "29. Write Python code to format standard ACL entry 10 permitting host 192.168.1.50.", req: "access-list", fullSolution: "acl_num = 10\nip = '192.168.1.50'\nprint(f'access-list {acl_num} permit host {ip}')", hint: "f'access-list {acl_num} permit host {ip}'" },
      { id: 30, level: 3, type: 'code', q: "30. Write a Python function generate_bgp_neighbor(asn, neighbor_ip) returning Cisco BGP CLI configuration.", req: "def generate_bgp_neighbor", fullSolution: "def generate_bgp_neighbor(asn, neighbor_ip):\n    return f'router bgp {asn}\\n neighbor {neighbor_ip} remote-as {asn}'\n\nprint(generate_bgp_neighbor(65000, '192.168.1.2'))", hint: "def generate_bgp_neighbor(asn, neighbor_ip): return ..." }
    ];

    // UNIQUE STORAGE KEY FOR CCNA
    const STORAGE_KEY = 'ccna_quest_state_v1';

    // STATE VARIABLES
    let currentIdx = 0; // Starts at Q1
    let globalLives = 3;
    let skipsLeft = { 1: 3, 2: 3, 3: 3 };
    let userAnswers = {};
    let failedAttempts = {};

    function saveStateToStorage() {
      const state = { currentIdx, globalLives, skipsLeft, userAnswers, failedAttempts };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadStateFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          currentIdx = parsed.currentIdx !== undefined ? parsed.currentIdx : 0;
          globalLives = parsed.globalLives !== undefined ? parsed.globalLives : 3;
          skipsLeft = parsed.skipsLeft || { 1: 3, 2: 3, 3: 3 };
          userAnswers = parsed.userAnswers || {};
          failedAttempts = parsed.failedAttempts || {};
        } catch (e) {
          console.error("Error loading state", e);
        }
      }
    }

    function resetGameProgress() {
      if (confirm("Are you sure you want to restart CCNA Quest from Question 1?")) {
        localStorage.removeItem(STORAGE_KEY);
        currentIdx = 0;
        globalLives = 3;
        skipsLeft = { 1: 3, 2: 3, 3: 3 };
        userAnswers = {};
        failedAttempts = {};
        renderQuestion();
      }
    }

    document.getElementById('user-answer').addEventListener('input', (e) => {
      userAnswers[QUESTIONS[currentIdx].id] = e.target.value;
      saveStateToStorage();
    });

    document.getElementById('python-code').addEventListener('input', (e) => {
      userAnswers[QUESTIONS[currentIdx].id] = e.target.value;
      saveStateToStorage();
    });

    function renderQuestion() {
      const q = QUESTIONS[currentIdx];
      const level = q.level;

      document.getElementById('level-badge').innerText = `Level ${level}`;
      document.getElementById('q-progress').innerText = `Question ${currentIdx + 1} / 30`;
      document.getElementById('lives-display').innerText = `❤️ Lives: ${globalLives}/3`;
      document.getElementById('skips-display').innerText = `Skips (Lvl ${level}): ${skipsLeft[level]} left`;

      document.getElementById('prev-btn').disabled = (currentIdx === 0);

      const levelTitles = {
        1: "Level 1: Terminology & Fundamentals",
        2: "Level 2: Cisco IOS & Subnetting",
        3: "Level 3: Cisco Automation Scripting"
      };
      document.getElementById('q-title').innerText = levelTitles[level];
      document.getElementById('q-text').innerText = q.q;

      const savedAnswer = userAnswers[q.id] || '';

      if (q.type === 'text') {
        document.getElementById('input-container').classList.remove('hidden');
        document.getElementById('compiler-container').classList.add('hidden');
        document.getElementById('user-answer').value = savedAnswer;
      } else {
        document.getElementById('input-container').classList.add('hidden');
        document.getElementById('compiler-container').classList.remove('hidden');
        document.getElementById('python-code').value = savedAnswer;
        document.getElementById('code-output').innerText = "Terminal output will appear here...";
      }

      document.getElementById('hint-box').classList.add('hidden');
      document.getElementById('hint-text').innerText = q.hint;

      saveStateToStorage();
    }

    async function runPythonCode() {
      const outputEl = document.getElementById('code-output');
      const code = document.getElementById('python-code').value;
      
      outputEl.innerText = "⏳ Executing network script...";

      try {
        if (!pyodideInstance) {
          pyodideInstance = await loadPyodide();
        }

        pyodideInstance.runPython(`
          import sys
          import io
          sys.stdout = io.StringIO()
        `);

        await pyodideInstance.runPythonAsync(code);

        let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
        outputEl.innerText = stdout || "Script executed successfully with no output (Use print() to display output).";
      } catch (err) {
        outputEl.innerText = "❌ Terminal Error:\n" + err.message;
      }
    }

    function checkAnswer() {
      const q = QUESTIONS[currentIdx];

      if (q.type === 'text') {
        const userAns = document.getElementById('user-answer').value.trim().toLowerCase();
        userAnswers[q.id] = document.getElementById('user-answer').value;
        saveStateToStorage();

        if (userAns === q.ans.toLowerCase() || userAns.includes(q.ans.toLowerCase())) {
          failedAttempts[q.id] = 0;
          advance();
        } else {
          triggerError();
        }
      } else {
        const code = document.getElementById('python-code').value;
        userAnswers[q.id] = code;
        saveStateToStorage();

        if (code.includes(q.req)) {
          failedAttempts[q.id] = 0;
          alert("Great job! Cisco Automation logic verified!");
          advance();
        } else {
          triggerError();
        }
      }
    }

    function triggerError() {
      const q = QUESTIONS[currentIdx];
      
      if (globalLives > 0) {
        globalLives--;
      }

      failedAttempts[q.id] = (failedAttempts[q.id] || 0) + 1;
      saveStateToStorage();
      
      document.getElementById('lives-display').innerText = `❤️ Lives: ${globalLives}/3`;
      
      let subtext = globalLives > 0 
        ? `You lost 1 life! ${globalLives} lives remaining. (${failedAttempts[q.id]}/5 attempts)` 
        : `0 lives remaining! (${failedAttempts[q.id]}/5 attempts)`;
      
      document.getElementById('modal-subtext').innerText = subtext;
      document.getElementById('solution-box').classList.add('hidden');

      const revealBtn = document.getElementById('reveal-solution-btn');
      if (failedAttempts[q.id] >= 5) {
        revealBtn.classList.remove('hidden');
      } else {
        revealBtn.classList.add('hidden');
      }

      document.getElementById('monkey-modal').classList.remove('hidden');
    }

    function revealSolution() {
      const q = QUESTIONS[currentIdx];
      const solCodeText = document.getElementById('solution-code-text');
      const solBox = document.getElementById('solution-box');

      solCodeText.innerText = q.fullSolution || q.ans;
      solBox.classList.remove('hidden');

      if (q.type === 'code') {
        document.getElementById('python-code').value = q.fullSolution;
      } else {
        document.getElementById('user-answer').value = q.ans;
      }
      userAnswers[q.id] = q.fullSolution || q.ans;
      saveStateToStorage();
    }

    function closeModal() {
      document.getElementById('monkey-modal').classList.add('hidden');
    }

    function toggleHint() {
      document.getElementById('hint-box').classList.toggle('hidden');
    }

    function skipQuestion() {
      const level = QUESTIONS[currentIdx].level;
      if (skipsLeft[level] > 0) {
        skipsLeft[level]--;
        saveStateToStorage();
        advance();
      } else {
        alert(`No skips remaining for Level ${level}!`);
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function advance() {
      if (currentIdx < QUESTIONS.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        alert("🎉 CONGRATULATIONS! You passed the CCNA/CCNP Network Quest!");
      }
    }

    // Load state and render
    loadStateFromStorage();
    renderQuestion();
  </script>
</body>
</html>
