<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybersecurity Recon Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pyodide Browser Python Interpreter -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans flex items-center justify-center p-3">

  <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
    
    <!-- Top Progress Bar -->
    <div class="bg-slate-800 p-4 text-white flex justify-between items-center border-b border-slate-700">
      <div>
        <span id="level-badge" class="bg-red-600 text-xs font-bold uppercase px-2 py-1 rounded">Level 3</span>
        <h1 class="text-sm font-semibold mt-1" id="q-progress">Question 21 / 30</h1>
      </div>
      <div class="text-right">
        <div id="lives-display" class="text-red-400 font-bold text-sm">❤️ Lives: 3/3</div>
        <div id="skips-display" class="text-xs text-slate-300 mt-0.5">Skips: 3 left</div>
      </div>
    </div>

    <!-- Question Container -->
    <div class="p-5">
      <h2 id="q-title" class="text-xs font-bold text-red-600 uppercase tracking-wide mb-1">Level 3: Terminal & Recon Scripting</h2>
      <p id="q-text" class="text-gray-800 font-medium text-base mb-4">Loading question...</p>

      <!-- Text Input Form (Levels 1 & 2) -->
      <div id="input-container" class="mb-4 hidden">
        <input type="text" id="user-answer" placeholder="Type command flag, keyword, or output..." 
               class="w-full border-2 border-slate-300 p-3 rounded-xl focus:border-red-600 outline-none text-gray-800 text-base font-mono">
      </div>

      <!-- Live Mobile Code Compiler (Level 3) -->
      <div id="compiler-container" class="mb-4">
        <label class="block text-xs font-semibold text-slate-700 mb-1">🛡️ Recon Scripting Terminal (Python):</label>
        <textarea id="python-code" rows="5" spellcheck="false"
                  class="w-full bg-slate-950 text-emerald-400 font-mono text-xs p-3 rounded-xl focus:outline-none mb-2 border border-slate-800" 
                  placeholder="# Write your Python reconnaissance or scanning code here..."></textarea>
        
        <button onclick="runPythonCode()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-emerald-700 transition mb-2">
          ▶️ Run Recon Script
        </button>

        <label class="block text-xs font-semibold text-gray-500 mb-1">Terminal Output:</label>
        <pre id="code-output" class="bg-slate-950 p-3 rounded-lg text-xs font-mono text-emerald-400 min-h-[60px] max-h-[120px] overflow-y-auto border border-slate-800">Terminal output will appear here...</pre>
      </div>

      <!-- Submit Button -->
      <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-red-700 transition active:scale-95 mb-3">
        Submit Answer
      </button>

      <!-- Control Buttons (Prev, Hint, Skip) -->
      <div class="grid grid-cols-3 gap-2 mb-3">
        <button id="prev-btn" onclick="prevQuestion()" class="bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-xs hover:bg-slate-300 transition disabled:opacity-40 disabled:cursor-not-allowed">
          ⬅️ Prev
        </button>
        <button onclick="toggleHint()" class="bg-amber-100 text-amber-800 font-semibold py-2 rounded-lg text-xs hover:bg-amber-200 transition">
          💡 Hint
        </button>
        <button onclick="skipQuestion()" class="bg-slate-100 text-slate-700 font-semibold py-2 rounded-lg text-xs hover:bg-slate-200 transition">
          ⏭️ Skip
        </button>
      </div>

      <!-- Reset Progress Option -->
      <div class="text-center">
        <button onclick="resetGameProgress()" class="text-slate-400 hover:text-red-500 text-[10px] underline">
          Restart Game from Q1
        </button>
      </div>

      <!-- Hint Box -->
      <div id="hint-box" class="hidden mt-3 p-3 bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-lg">
        <strong>Hint:</strong> <span id="hint-text"></span>
      </div>
    </div>
  </div>

  <!-- Funny Monkey Error Modal -->
  <div id="monkey-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl p-5 text-center max-w-xs w-full shadow-2xl border border-slate-200">
      <img src="https://media.giphy.com/media/eH4O6fWvuKePi/giphy.gif" alt="Funny Monkey" class="w-36 h-36 object-cover mx-auto rounded-xl mb-3 shadow">
      <h3 class="text-lg font-bold text-red-600">Access Denied! Incorrect Answer</h3>
      <p id="modal-subtext" class="text-xs text-gray-600 my-2">You lost 1 life! Try again.</p>
      
      <!-- Show Solution Button (Appears after 5 failed attempts) -->
      <button id="reveal-solution-btn" onclick="revealSolution()" class="w-full bg-amber-500 text-white font-bold py-2 rounded-xl text-xs shadow hover:bg-amber-600 mb-2 hidden">
        🔓 Reveal Solution Code
      </button>

      <!-- Solution Display Box -->
      <div id="solution-box" class="hidden my-2 p-2 bg-slate-950 text-emerald-400 font-mono text-[11px] rounded-lg text-left overflow-x-auto border border-slate-800 max-h-[100px]">
        <pre id="solution-code-text"></pre>
      </div>

      <button onclick="closeModal()" class="w-full bg-red-600 text-white font-bold py-2 rounded-xl text-sm shadow hover:bg-red-700">
        Try Again
      </button>
    </div>
  </div>

  <script>
    // INITIALIZE PYODIDE IN BACKGROUND
    let pyodideInstance = null;
    async function initPyodide() {
      if (!pyodideInstance) {
        pyodideInstance = await loadPyodide();
      }
    }
    initPyodide(); // Pre-loads engine

    // 30 CYBERSECURITY QUESTIONS DATASET (Whois, Sublist3r, Nmap)
    const QUESTIONS = [
      // Level 1: Terminology & Flags (1-10)
      { id: 1, level: 1, type: 'text', q: "1. What command line protocol/tool is used to query domain registration records?", ans: "whois", hint: "It literally asks 'Who is' this domain registered to." },
      { id: 2, level: 1, type: 'text', q: "2. Which Python tool uses search engines (Google, Bing, Yahoo) to enumerate subdomains?", ans: "sublist3r", hint: "Subdomain listing tool written in Python." },
      { id: 3, level: 1, type: 'text', q: "3. What is the Nmap flag for performing a default TCP SYN stealth scan?", ans: "-sS", hint: "s for scan, S for SYN." },
      { id: 4, level: 1, type: 'text', q: "4. What Nmap flag enables service and version detection on open ports?", ans: "-sV", hint: "s for scan, V for Version." },
      { id: 5, level: 1, type: 'text', q: "5. In Sublist3r, which flag specifies the target domain name to enumerate?", ans: "-d", hint: "d stands for domain." },
      { id: 6, level: 1, type: 'text', q: "6. What Nmap flag enables OS detection on the target host?", ans: "-O", hint: "Capital O stands for Operating System." },
      { id: 7, level: 1, type: 'text', q: "7. Which Sublist3r flag enables brute-forcing subdomains with subbrute?", ans: "-b", hint: "b stands for brute-force." },
      { id: 8, level: 1, type: 'text', q: "8. What Nmap flag skips host discovery and assumes the host is online (no ICMP ping)?", ans: "-Pn", hint: "P for Ping, n for No." },
      { id: 9, level: 1, type: 'text', q: "9. What WHOIS record parameter shows the date when a domain registration expires?", ans: "expiry date", hint: "Contains the word 'expiry' or 'expiration'." },
      { id: 10, level: 1, type: 'text', q: "10. What Nmap flag scans all 65,535 TCP ports?", ans: "-p-", hint: "Dash after the port flag." },

      // Level 2: Output & Behavior Prediction (11-20)
      { id: 11, level: 2, type: 'text', q: "11. What scan mode is executed when running 'nmap -sU target'?", ans: "udp scan", hint: "-sU scans UDP ports." },
      { id: 12, level: 2, type: 'text', q: "12. What does 'sublist3r -d example.com -o results.txt' do with -o?", ans: "save output to file", hint: "Saves findings to a specified output file." },
      { id: 13, level: 2, type: 'text', q: "13. In WHOIS, what record shows the DNS servers authoritative for the domain?", ans: "nameservers", hint: "Contains 'name' and 'servers' (or NS records)." },
      { id: 14, level: 2, type: 'text', q: "14. What Nmap timing template (-T0 to -T5) represents the fastest scan speed?", ans: "-T5", hint: "-T5 is Insane speed mode." },
      { id: 15, level: 2, type: 'text', q: "15. What Nmap flag combines OS detection, version scanning, script scanning, and traceroute?", ans: "-A", hint: "Aggressive scan flag (capital letter)." },
      { id: 16, level: 2, type: 'text', q: "16. In Nmap, what port state indicates a firewall or packet filter is blocking probes?", ans: "filtered", hint: "The status returned when packets are dropped silently." },
      { id: 17, level: 2, type: 'text', q: "17. Which Nmap switch executes standard NSE (Nmap Scripting Engine) vulnerability scripts?", ans: "-sC", hint: "-sC or --script=default." },
      { id: 18, level: 2, type: 'text', q: "18. Which Sublist3r flag lets you specify specific search engines (e.g., google,bing)?", ans: "-e", hint: "e stands for engines." },
      { id: 19, level: 2, type: 'text', q: "19. What type of DNS record maps host/subdomain names to IPv4 addresses?", ans: "A record", hint: "Single letter A record." },
      { id: 20, level: 2, type: 'text', q: "20. What Nmap flag saves scan results in Grepable output format?", ans: "-oG", hint: "o for output, G for grepable." },

      // Level 3: Scripting & Automation (21-30)
      { id: 21, level: 3, type: 'code', q: "21. Write Python code to build a sublist3r execution command for domain 'target.com' and print it.", req: "sublist3r", fullSolution: "domain = 'target.com'\ncmd = f'sublist3r -d {domain} -o output.txt'\nprint(cmd)", hint: "print(f'sublist3r -d {domain}')" },
      { id: 22, level: 3, type: 'code', q: "22. Write Python code to construct an Nmap SYN scan command targeting '192.168.1.1' for ports 80 and 443.", req: "-sS", fullSolution: "ip = '192.168.1.1'\ncmd = f'nmap -sS -p 80,443 {ip}'\nprint(cmd)", hint: "cmd = f'nmap -sS -p 80,443 {ip}'" },
      { id: 23, level: 3, type: 'code', q: "23. Write Python code to extract and print domain nameservers from a list of WHOIS lines.", req: "nameserver", fullSolution: "whois_data = ['Domain: test.com', 'Name Server: NS1.EXAMPLE.COM', 'Name Server: NS2.EXAMPLE.COM']\nfor line in whois_data:\n    if 'Name Server' in line:\n        print(line)", hint: "Filter lines containing 'Name Server'" },
      { id: 24, level: 3, type: 'code', q: "24. Write Python code to filter subdomains list for those containing the word 'admin'.", req: "admin", fullSolution: "subdomains = ['admin.test.com', 'mail.test.com', 'dev-admin.test.com']\nadmin_subs = [s for s in subdomains if 'admin' in s]\nprint(admin_subs)", hint: "[s for s in subdomains if 'admin' in s]" },
      { id: 25, level: 3, type: 'code', q: "25. Write Python code that builds an Nmap aggressive scan command with fast timing (-T4).", req: "-A", fullSolution: "target = '10.0.0.1'\ncmd = f'nmap -A -T4 {target}'\nprint(cmd)", hint: "f'nmap -A -T4 {target}'" },
      { id: 26, level: 3, type: 'code', q: "26. Write Python code to format a list of discovered open ports into a comma-separated string for Nmap -p.", req: "join", fullSolution: "ports = [21, 22, 80, 443]\nport_str = ','.join(map(str, ports))\nprint(f'nmap -p {port_str} target.com')", hint: "','.join(map(str, ports))" },
      { id: 27, level: 3, type: 'code', q: "27. Write Python code that parses an Nmap output list and prints only ports marked 'open'.", req: "open", fullSolution: "nmap_out = ['22/tcp open ssh', '80/tcp closed http', '443/tcp open https']\nopen_ports = [line for line in nmap_out if 'open' in line]\nprint(open_ports)", hint: "Filter list with 'open' in line" },
      { id: 28, level: 3, type: 'code', q: "28. Write Python code to simulate checking WHOIS expiry status (Print 'Expired' if year < 2026).", req: "2026", fullSolution: "exp_year = 2024\nif exp_year < 2026:\n    print('Expired')\nelse:\n    print('Active')", hint: "if exp_year < 2026: print('Expired')" },
      { id: 29, level: 3, type: 'code', q: "29. Write Python code to format a Sublist3r multi-engine search command (-e google,bing,yahoo).", req: "-e", fullSolution: "engines = ['google', 'bing', 'yahoo']\ncmd = f\"sublist3r -d target.com -e {','.join(engines)}\"\nprint(cmd)", hint: "f\"sublist3r -d target.com -e {','.join(engines)}\"" },
      { id: 30, level: 3, type: 'code', q: "30. Write a Python function run_recon(domain) that returns a full recon pipeline command string.", req: "def run_recon", fullSolution: "def run_recon(domain):\n    return f'sublist3r -d {domain} && nmap -sV -iL subdomains.txt'\n\nprint(run_recon('example.com'))", hint: "def run_recon(domain): return f'sublist3r -d {domain} ...'" }
    ];

    // STATE VARIABLES
    let currentIdx = 20; // Defaults to Question 21 (Level 3)
    let globalLives = 3;
    let skipsLeft = { 1: 3, 2: 3, 3: 3 };
    let userAnswers = {};
    let failedAttempts = {}; // Tracks failed attempts per question ID

    function saveStateToStorage() {
      const state = { currentIdx, globalLives, skipsLeft, userAnswers, failedAttempts };
      localStorage.setItem('cyber_quest_game_state', JSON.stringify(state));
    }

    function loadStateFromStorage() {
      const saved = localStorage.getItem('cyber_quest_game_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          currentIdx = parsed.currentIdx !== undefined ? parsed.currentIdx : 20;
          globalLives = parsed.globalLives !== undefined ? parsed.globalLives : 3;
          skipsLeft = parsed.skipsLeft || { 1: 3, 2: 3, 3: 3 };
          userAnswers = parsed.userAnswers || {};
          failedAttempts = parsed.failedAttempts || {};
        } catch (e) {
          console.error("Error loading state", e);
        }
      }
    }

    function resetGameProgress() {
      if (confirm("Are you sure you want to restart from Question 1?")) {
        localStorage.removeItem('cyber_quest_game_state');
        currentIdx = 0;
        globalLives = 3;
        skipsLeft = { 1: 3, 2: 3, 3: 3 };
        userAnswers = {};
        failedAttempts = {};
        renderQuestion();
      }
    }

    document.getElementById('user-answer').addEventListener('input', (e) => {
      userAnswers[QUESTIONS[currentIdx].id] = e.target.value;
      saveStateToStorage();
    });

    document.getElementById('python-code').addEventListener('input', (e) => {
      userAnswers[QUESTIONS[currentIdx].id] = e.target.value;
      saveStateToStorage();
    });

    function renderQuestion() {
      const q = QUESTIONS[currentIdx];
      const level = q.level;

      document.getElementById('level-badge').innerText = `Level ${level}`;
      document.getElementById('q-progress').innerText = `Question ${currentIdx + 1} / 30`;
      document.getElementById('lives-display').innerText = `❤️ Lives: ${globalLives}/3`;
      document.getElementById('skips-display').innerText = `Skips (Lvl ${level}): ${skipsLeft[level]} left`;

      document.getElementById('prev-btn').disabled = (currentIdx === 0);

      const levelTitles = {
        1: "Level 1: Terminology & Flags",
        2: "Level 2: Recon & Output Analysis",
        3: "Level 3: Terminal & Recon Scripting"
      };
      document.getElementById('q-title').innerText = levelTitles[level];
      document.getElementById('q-text').innerText = q.q;

      const savedAnswer = userAnswers[q.id] || '';

      if (q.type === 'text') {
        document.getElementById('input-container').classList.remove('hidden');
        document.getElementById('compiler-container').classList.add('hidden');
        document.getElementById('user-answer').value = savedAnswer;
      } else {
        document.getElementById('input-container').classList.add('hidden');
        document.getElementById('compiler-container').classList.remove('hidden');
        document.getElementById('python-code').value = savedAnswer;
        document.getElementById('code-output').innerText = "Terminal output will appear here...";
      }

      document.getElementById('hint-box').classList.add('hidden');
      document.getElementById('hint-text').innerText = q.hint;

      saveStateToStorage();
    }

    async function runPythonCode() {
      const outputEl = document.getElementById('code-output');
      const code = document.getElementById('python-code').value;
      
      outputEl.innerText = "⏳ Running script in terminal...";

      try {
        if (!pyodideInstance) {
          pyodideInstance = await loadPyodide();
        }

        pyodideInstance.runPython(`
          import sys
          import io
          sys.stdout = io.StringIO()
        `);

        await pyodideInstance.runPythonAsync(code);

        let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
        outputEl.innerText = stdout || "Script executed successfully with no output (Use print() to display results).";
      } catch (err) {
        outputEl.innerText = "❌ Terminal Error:\n" + err.message;
      }
    }

    function checkAnswer() {
      const q = QUESTIONS[currentIdx];

      if (q.type === 'text') {
        const userAns = document.getElementById('user-answer').value.trim().toLowerCase();
        userAnswers[q.id] = document.getElementById('user-answer').value;
        saveStateToStorage();

        if (userAns === q.ans.toLowerCase() || userAns.includes(q.ans.toLowerCase())) {
          failedAttempts[q.id] = 0; // Reset on success
          advance();
        } else {
          triggerError();
        }
      } else {
        const code = document.getElementById('python-code').value;
        userAnswers[q.id] = code;
        saveStateToStorage();

        if (code.includes(q.req)) {
          failedAttempts[q.id] = 0; // Reset on success
          alert("Great job! Recon script verified!");
          advance();
        } else {
          triggerError();
        }
      }
    }

    function triggerError() {
      const q = QUESTIONS[currentIdx];
      
      if (globalLives > 0) {
        globalLives--;
      }

      // Track failed attempts for current question
      failedAttempts[q.id] = (failedAttempts[q.id] || 0) + 1;
      saveStateToStorage();
      
      document.getElementById('lives-display').innerText = `❤️ Lives: ${globalLives}/3`;
      
      let subtext = globalLives > 0 
        ? `You lost 1 life! ${globalLives} lives remaining. (${failedAttempts[q.id]}/5 attempts)` 
        : `0 lives remaining! (${failedAttempts[q.id]}/5 attempts)`;
      
      document.getElementById('modal-subtext').innerText = subtext;

      // Hide solution box by default when modal opens
      document.getElementById('solution-box').classList.add('hidden');

      // Show "Reveal Solution" button if failed 5 or more times
      const revealBtn = document.getElementById('reveal-solution-btn');
      if (failedAttempts[q.id] >= 5) {
        revealBtn.classList.remove('hidden');
      } else {
        revealBtn.classList.add('hidden');
      }

      document.getElementById('monkey-modal').classList.remove('hidden');
    }

    function revealSolution() {
      const q = QUESTIONS[currentIdx];
      const solCodeText = document.getElementById('solution-code-text');
      const solBox = document.getElementById('solution-box');

      solCodeText.innerText = q.fullSolution || q.ans;
      solBox.classList.remove('hidden');

      // Also copy solution directly into the code compiler / input box for convenience
      if (q.type === 'code') {
        document.getElementById('python-code').value = q.fullSolution;
      } else {
        document.getElementById('user-answer').value = q.ans;
      }
      userAnswers[q.id] = q.fullSolution || q.ans;
      saveStateToStorage();
    }

    function closeModal() {
      document.getElementById('monkey-modal').classList.add('hidden');
    }

    function toggleHint() {
      document.getElementById('hint-box').classList.toggle('hidden');
    }

    function skipQuestion() {
      const level = QUESTIONS[currentIdx].level;
      if (skipsLeft[level] > 0) {
        skipsLeft[level]--;
        saveStateToStorage();
        advance();
      } else {
        alert(`No skips remaining for Level ${level}!`);
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function advance() {
      if (currentIdx < QUESTIONS.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        alert("🎉 CONGRATULATIONS! You completed all 30 Cybersecurity Recon questions!");
      }
    }

    // Load state or default to Q21
    loadStateFromStorage();
    renderQuestion();
  </script>
</body>
</html>
